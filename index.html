<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiempo en Temuco</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Ventana compacta tipo widget: bloque actual arriba, franja horaria, lista de 7 días */
:root{
  --bg:#eef2ef; --card:#ffffff; --fg:#1d2a26; --muted:#5e6f69; --line:#d8e1dd;
  --accent:#2f7a5f; --rain:#3b6fb3; --warm:#c46a2b;
  --display:"Fraunces", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121916; --card:#1a2420; --fg:#e6eeea; --muted:#93a59e; --line:#2a3833;
        --accent:#6cc5a1; --rain:#7fa9e6; --warm:#e79a5e; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.wrap>*{min-width:0}
html,body{overflow-x:hidden}
/* Modo panel desplegable junto a la bandeja */
html.panel,html.panel body{overflow:hidden}
html.panel body{border:1px solid var(--line);height:100vh;box-sizing:border-box}
html.panel .wrap{padding:14px 14px 16px;gap:10px;max-width:none}
html.panel #semana,html.panel #pie{display:none}
html.panel .card{padding:14px 16px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cardhead h2{margin-bottom:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:.8rem;font-weight:600;cursor:pointer}
.linkbtn:hover,.linkbtn:focus-visible{text-decoration:underline;outline:none}
/* Panel lateral izquierdo: pronóstico completo, más amplio */
html.lateral body{border:1px solid var(--line);height:100vh;box-sizing:border-box;overflow-y:auto}
html.lateral .wrap{max-width:none;padding:22px 22px 26px;gap:14px}
html.lateral .city{font-size:1.6rem}
html.lateral .temp{font-size:4.4rem}
html.lateral .glyph{font-size:4rem}
html.lateral .h{flex-basis:58px}
html.lateral .d{grid-template-columns:64px 30px 56px minmax(0,1fr);padding:8px 0}
html.lateral #cerrar{display:inline-flex}
#cerrar{display:none}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.city{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0}
.sub{color:var(--muted);font-size:.8rem;letter-spacing:.04em}
button,input{font:inherit;color:inherit}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.iconbtn{white-space:nowrap}
header>div:first-child{min-width:0}
.stats{grid-template-columns:.8fr 1.35fr 1.05fr .8fr !important}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}
.iconbtn:hover,.iconbtn:focus-visible{border-color:var(--accent);outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.now{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.glyph,.h .g,.d>span:nth-child(2){font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.sun{width:1.1em;height:1.1em;vertical-align:-0.15em}
.glyph{font-size:3.4rem;line-height:1;grid-row:span 2}
.temp{font-family:var(--display);font-weight:300;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.temp sup{font-size:1.4rem;vertical-align:top;margin-left:2px}
.desc{font-weight:600}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stat{display:grid;gap:2px}
.stat b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}}
.stat span{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.h{flex:0 0 52px;text-align:center;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.h .t{color:var(--muted);font-size:.75rem}
.h .g{font-size:1.3rem}
.h .p{color:var(--rain);font-size:.72rem;min-height:1em}
.days{display:grid;gap:2px}
.d{display:grid;grid-template-columns:52px 26px 50px minmax(0,1fr);align-items:center;gap:10px;padding:6px 0;font-variant-numeric:tabular-nums}
.d .n{font-weight:500}
.d .p{color:var(--rain);font-size:.78rem}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line)}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--rain),var(--warm))}
.range{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:3px}
.range b{color:var(--fg);font-weight:600}
form{display:flex;gap:8px}
form input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
form input:focus{outline:2px solid var(--accent);outline-offset:1px}
.results{display:grid;gap:4px;margin-top:8px}
.results button{text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.results button:hover{border-color:var(--accent)}
.msg{color:var(--muted);font-size:.85rem}
footer{color:var(--muted);font-size:.72rem;text-align:center}
footer a{color:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="city" id="city">Temuco</h1>
      <div class="sub" id="updated">Cargando…</div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="refresh" title="Actualizar">↻</button>
      <button class="iconbtn" id="change">Cambiar ciudad</button>
      <button class="iconbtn" id="cerrar" title="Cerrar (Esc)" aria-label="Cerrar">✕</button>
    </div>
  </header>

  <section class="card" id="search" hidden>
    <form id="form">
      <input id="q" placeholder="Ej: Pucón, Valdivia, Santiago" autocomplete="off">
      <button class="iconbtn" type="submit">Buscar</button>
    </form>
    <div class="results" id="results"></div>
  </section>

  <section class="card now">
    <div class="glyph" id="glyph">⛅</div>
    <div class="temp" id="temp">--<sup>°C</sup></div>
    <div><span class="desc" id="desc">—</span> · <span class="msg" id="feels"></span></div>
    <div class="stats">
      <div class="stat"><b id="hum">--</b><span>Humedad</span></div>
      <div class="stat"><b id="wind">--</b><span>Viento</span></div>
      <div class="stat"><b id="rain">--</b><span>Lluvia hoy</span></div>
      <div class="stat"><b id="uv">--</b><span>Índice UV</span></div>
    </div>
  </section>

  <section class="card">
    <div class="cardhead"><h2>Próximas horas</h2><button class="linkbtn" id="ver7" type="button" hidden>Ver 7 días →</button></div>
    <div class="hours" id="hours"></div>
  </section>

  <section class="card" id="semana">
    <h2>7 días</h2>
    <div class="days" id="days"></div>
  </section>

  <footer id="pie">Datos de <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · se actualiza cada 15 min</footer>
</div>

<script>
const DEFAULT = {name:"Temuco", region:"Araucanía, Chile", lat:-38.7359, lon:-72.5904};
let place = DEFAULT;
try { const s = JSON.parse(localStorage.getItem("tiempo.place")); if (s && s.lat) place = s; } catch(e){}

const CODES = {
  0:["Despejado","SUN","🌙"],1:["Mayormente despejado","🌤️","🌙"],2:["Parcialmente nublado","⛅","☁️"],3:["Nublado","☁️","☁️"],
  45:["Neblina","FOG"],48:["Neblina con escarcha","FOG"],
  51:["Llovizna débil","🌦️"],53:["Llovizna","🌦️"],55:["Llovizna intensa","🌧️"],
  56:["Llovizna helada","🌧️"],57:["Llovizna helada","🌧️"],
  61:["Lluvia débil","🌦️"],63:["Lluvia","🌧️"],65:["Lluvia intensa","🌧️"],
  66:["Lluvia helada","🌧️"],67:["Lluvia helada","🌧️"],
  71:["Nieve débil","🌨️"],73:["Nieve","🌨️"],75:["Nieve intensa","❄️"],77:["Granizo fino","🌨️"],
  80:["Chubascos","🌦️"],81:["Chubascos","🌧️"],82:["Chubascos fuertes","⛈️"],
  85:["Chubascos de nieve","🌨️"],86:["Chubascos de nieve","❄️"],
  95:["Tormenta","⛈️"],96:["Tormenta con granizo","⛈️"],99:["Tormenta con granizo","⛈️"]
};
const FOG = '<svg class="sun" viewBox="0 0 24 24" aria-label="Neblina"><g stroke="#a9b8c4" stroke-width="2.2" stroke-linecap="round"><path d="M3 7h14M6 12h15M3 17h13"/></g></svg>';
const SUN = '<svg class="sun" viewBox="0 0 24 24" aria-label="Sol"><g stroke="#f5b43c" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></g><circle cx="12" cy="12" r="5" fill="#f7c548"/></svg>';
const info = (c, day=1) => { const x = CODES[c] || ["—","☁️"]; let icon = (!day && x[2]) ? x[2] : x[1]; if (icon === "SUN") icon = SUN; else if (icon === "FOG") icon = FOG; return {text:x[0], icon}; };
const $ = id => document.getElementById(id);
const dirs = ["N","NE","E","SE","S","SO","O","NO"];
const dir = d => dirs[Math.round(d/45)%8];

let lastLoad = 0;
async function load(){
  lastLoad = Date.now();
  $("city").textContent = place.name;
  $("updated").textContent = "Actualizando…";
  const url = "https://api.open-meteo.com/v1/forecast?latitude="+place.lat+"&longitude="+place.lon+
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_direction_10m"+
    "&hourly=temperature_2m,weather_code,precipitation_probability,is_day"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,uv_index_max"+
    "&timezone=auto&forecast_days=7";
  try{
    const r = await fetch(url); if(!r.ok) throw new Error(r.status);
    render(await r.json());
  }catch(e){
    $("updated").textContent = "Sin conexión. Reintentando en 1 min.";
    setTimeout(load, 60000);
  }
}

function render(d){
  const c = d.current, w = info(c.weather_code, c.is_day);
  $("glyph").innerHTML = w.icon;
  $("temp").innerHTML = Math.round(c.temperature_2m) + "<sup>°C</sup>";
  $("desc").textContent = w.text;
  $("feels").textContent = "Sensación " + Math.round(c.apparent_temperature) + "°";
  $("hum").textContent = c.relative_humidity_2m + "%";
  $("wind").textContent = Math.round(c.wind_speed_10m) + " km/h " + dir(c.wind_direction_10m);
  $("rain").textContent = d.daily.precipitation_sum[0].toFixed(1) + " mm";
  $("uv").textContent = Math.round(d.daily.uv_index_max[0]);
  document.title = Math.round(c.temperature_2m) + "° " + place.name;

  // horas
  const now = c.time.slice(0,13);
  let i = d.hourly.time.findIndex(t => t.slice(0,13) >= now); if (i < 0) i = 0;
  const hours = $("hours"); hours.innerHTML = "";
  for (let k = i; k < Math.min(i+24, d.hourly.time.length); k++){
    const p = d.hourly.precipitation_probability[k];
    const el = document.createElement("div"); el.className = "h";
    el.innerHTML = '<span class="t">'+(k===i?"Ahora":d.hourly.time[k].slice(11,16))+'</span>'+
      '<span class="g">'+info(d.hourly.weather_code[k], d.hourly.is_day[k]).icon+'</span>'+
      '<b>'+Math.round(d.hourly.temperature_2m[k])+'°</b>'+
      '<span class="p">'+(p>=20?p+"%":"")+'</span>';
    hours.appendChild(el);
  }

  // días
  const lo = Math.min(...d.daily.temperature_2m_min), hi = Math.max(...d.daily.temperature_2m_max), span = Math.max(1, hi-lo);
  const days = $("days"); days.innerHTML = "";
  d.daily.time.forEach((t, k) => {
    const date = new Date(t+"T12:00");
    const name = k===0 ? "Hoy" : date.toLocaleDateString("es-CL",{weekday:"short"}).replace(".","");
    const mn = d.daily.temperature_2m_min[k], mx = d.daily.temperature_2m_max[k], p = d.daily.precipitation_probability_max[k];
    const el = document.createElement("div"); el.className = "d";
    el.innerHTML = '<span class="n">'+name.charAt(0).toUpperCase()+name.slice(1)+'</span>'+
      '<span>'+info(d.daily.weather_code[k]).icon+'</span>'+
      '<span class="p">'+(p>=20?"💧"+p+"%":"")+'</span>'+
      '<div><div class="bar"><i style="left:'+((mn-lo)/span*100)+'%;right:'+((hi-mx)/span*100)+'%"></i></div>'+
      '<div class="range"><span>'+Math.round(mn)+'°</span><b>'+Math.round(mx)+'°</b></div></div>';
    days.appendChild(el);
  });

  $("updated").textContent = (place.region ? place.region + " · " : "") + "actualizado " +
    new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
}

// buscar ciudad
$("change").onclick = () => { $("search").hidden = !$("search").hidden; if(!$("search").hidden) $("q").focus(); };
$("refresh").onclick = load;
$("form").onsubmit = async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if(!q) return;
  const box = $("results"); box.innerHTML = '<span class="msg">Buscando…</span>';
  try{
    const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=es&name="+encodeURIComponent(q));
    const j = await r.json(); box.innerHTML = "";
    if(!j.results){ box.innerHTML = '<span class="msg">No encontré esa ciudad. Prueba con otro nombre.</span>'; return; }
    j.results.forEach(x => {
      const b = document.createElement("button");
      const region = [x.admin1, x.country].filter(Boolean).join(", ");
      b.textContent = x.name + " — " + region;
      b.onclick = () => {
        place = {name:x.name, region, lat:x.latitude, lon:x.longitude};
        try{ localStorage.setItem("tiempo.place", JSON.stringify(place)); }catch(e){}
        if (location.protocol.startsWith("http"))
          fetch("/api/place",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(place)}).catch(()=>{});
        $("search").hidden = true; $("q").value = ""; box.innerHTML = ""; load();
      };
      box.appendChild(b);
    });
  }catch(err){ box.innerHTML = '<span class="msg">No se pudo buscar. Revisa tu conexión.</span>'; }
};

const QS = new URLSearchParams(location.search);
const PANEL = QS.has("panel"), LATERAL = QS.has("lateral");
const ocultar = () => fetch("/api/ocultar", {method:"POST"}).catch(()=>{});
if (LATERAL) {
  document.documentElement.classList.add("lateral");
  const wrapL = document.querySelector(".wrap");
  let lastL = 0;
  new ResizeObserver(() => {
    const h = Math.ceil(wrapL.getBoundingClientRect().height) + 2;
    if (h !== lastL) { lastL = h; fetch("/api/alto?p=lateral", {method:"POST", body:String(h)}).catch(()=>{}); }
  }).observe(wrapL);
  document.getElementById("cerrar").onclick = ocultar;
  document.addEventListener("keydown", e => { if (e.key === "Escape") ocultar(); });
}
if (PANEL) {
  document.documentElement.classList.add("panel");
  const wrap = document.querySelector(".wrap");
  let last = 0;
  const report = () => {
    const h = Math.ceil(wrap.getBoundingClientRect().height) + 2;
    if (h !== last) { last = h; fetch("/api/alto", {method:"POST", body:String(h)}).catch(()=>{}); }
  };
  new ResizeObserver(report).observe(wrap);
  const v7 = document.getElementById("ver7");
  v7.hidden = false;
  v7.onclick = () => fetch("/api/lateral", {method:"POST"}).catch(()=>{});
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") fetch("/api/ocultar", {method:"POST"}).catch(()=>{});
  });
}
(async () => {
  if (location.protocol.startsWith("http")) {
    try { const r = await fetch("/api/place"); const p = await r.json(); if (p && p.lat) place = p; } catch(e){}
  }
  load();
  setInterval(load, 15*60*1000);
  // Al volver a mostrar un panel: misma ciudad que el ícono y datos frescos.
  if (location.protocol.startsWith("http")) {
    let busy = false;
    const sync = async () => {
      if (busy) return; busy = true;
      try {
        const p = await (await fetch("/api/place")).json();
        const changed = p && p.lat && (p.lat !== place.lat || p.lon !== place.lon);
        if (changed) place = p;
        if (changed || Date.now() - lastLoad > 10*60*1000) await load();
      } catch(e){}
      busy = false;
    };
    window.addEventListener("focus", sync);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
  }
})();
</script>
</body>
</html>
